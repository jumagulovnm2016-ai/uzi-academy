<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Угадай снимок · Академия УЗИ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@600;700&family=PT+Sans:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="engine/guess.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a7b83">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
[hidden]{display:none!important}
.backlink{font-size:14px;color:var(--teal);font-weight:700;text-decoration:none}
.alt{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.alt a{color:var(--teal);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header><a class="backlink" href="./">← Все тесты</a><span class="eyebrow" id="eyebrow">Академия УЗИ</span><h1 id="h1">Загрузка…</h1></header>

  <section class="card" id="start">
    <p class="muted" id="about"></p>
    <ul class="rules muted" id="rules"></ul>
    <label for="fio">ФИО курсанта</label>
    <input id="fio" autocomplete="name" maxlength="120" placeholder="Иванов Иван Иванович">
    <p class="err" id="fioerr" hidden>Введите хотя бы фамилию и имя, буквами.</p>
    <button class="btn" id="go" type="button">Начать</button>
    <div class="alt muted">
      <span>Без таймера на каждый снимок: <a id="asquiz" href="#">пройти как обычный тест</a> (учебный режим или экзамен).</span>
      <span id="mistline" hidden>Ваши ошибки в этой игре: <b id="mistn">0</b> — <a id="asreview" href="#">разобрать их</a>.</span>
    </div>
  </section>

  <section class="card" id="game" hidden aria-live="polite">
    <div class="hud"><span><span id="unit">Снимок</span> <b id="qn">1</b> / <span id="qtotal">0</span></span><span>Баллы <b id="score">0</b></span></div>
    <div class="timebar" aria-hidden="true"><i id="bar"></i></div>
    <div class="secs" id="secs" role="timer"></div>
    <span class="tag" id="tag"></span>
    <p class="q" id="qtext"></p>
    <figure class="qimg"><a id="imglink" target="_blank" rel="noopener" title="Открыть крупно"><img id="qimg" alt="" decoding="async"></a></figure>
    <div class="grid" id="tiles"></div>
    <div id="fb" hidden></div>
    <button class="btn" id="next" type="button" hidden>Следующий вопрос →</button>
  </section>

  <section class="card" id="result" hidden></section>

  <footer id="foot"></footer>
</div>
<script src="engine/vendor/ts-fsrs-5.4.1.umd.js"></script>
<script src="engine/srs.js"></script>
<script src="engine/guess.js"></script>
<script src="offline.js"></script>
</body>
</html>
